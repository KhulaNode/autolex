services:
  website:
    image: ${AUTOLEX_IMAGE:-autolex:local}
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      BUSINESS_EMAIL: ${BUSINESS_EMAIL:-info@autolex.co.za}
      BUSINESS_WHATSAPP: ${BUSINESS_WHATSAPP:-27730572188}
      FACEBOOK_URL: ${FACEBOOK_URL:-}
      INSTAGRAM_URL: ${INSTAGRAM_URL:-}
      WEEKDAY_OPEN: ${WEEKDAY_OPEN:-08:00}
      WEEKDAY_CLOSE: ${WEEKDAY_CLOSE:-16:30}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
